name: Deploy development

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: raccoon-pirate-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          for name in DEV_SSH_HOST DEV_SSH_USER DEV_SSH_KEY DEV_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host lightsail-dev
            HostName $DEV_SSH_HOST
            User $DEV_SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Check server access
        run: |
          ssh lightsail-dev 'sudo -n docker info >/dev/null &&
            sudo -n docker compose version &&
            sudo -n docker volume inspect raccoon-pirate_caddy_data >/dev/null &&
            sudo -n docker volume inspect raccoon-pirate_caddy_config >/dev/null'

      - name: Build images
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --tag "raccoon-pirate-web:$GITHUB_SHA" \
            .

          docker build \
            --platform linux/amd64 \
            --tag "raccoon-pirate-backend:$GITHUB_SHA" \
            ./backend

          docker save \
            "raccoon-pirate-web:$GITHUB_SHA" \
            "raccoon-pirate-backend:$GITHUB_SHA" |
            gzip > image.tar.gz

      - name: Transfer release
        run: |
          set -euo pipefail
          release="/opt/raccoon-pirate/releases/$GITHUB_SHA"

          ssh lightsail-dev "mkdir -p '$release/infra'"

          scp image.tar.gz "lightsail-dev:$release/image.tar.gz"
          scp deploy/compose.dev.yaml "lightsail-dev:$release/compose.yaml"

          scp deploy/compose.infra.yaml deploy/compose.identity.yaml \
            "lightsail-dev:$release/infra/"

          scp -r deploy/mongo deploy/postgres deploy/kratos \
            "lightsail-dev:$release/infra/"
      - name: Deploy and verify application and identity services
        shell: bash
        run: |
          set -euo pipefail

          ssh lightsail-dev bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          sha="$1"
          release="/opt/raccoon-pirate/releases/$sha"
          secrets=/opt/raccoon-pirate/secrets/dev.env
          cd "$release"

          sudo -n test -s "$secrets"

          infra=(
            sudo -n docker compose
            --project-name raccoon-pirate-infra-dev
            --env-file "$secrets"
            --file "$release/infra/compose.infra.yaml"
            --file "$release/infra/compose.identity.yaml"
          )

          "${infra[@]}" config --quiet

          sudo -n docker load --input image.tar.gz
          rm image.tar.gz

          printf 'DEV_IMAGE=raccoon-pirate-web:%s\n' "$sha" > image.env
          printf 'DEV_BACKEND_IMAGE=raccoon-pirate-backend:%s\n' "$sha" >> image.env

          compose=(
            sudo -n docker compose
            --project-name raccoon-pirate
            --env-file "$secrets"
            --env-file "$release/image.env"
            --file "$release/compose.yaml"
          )

          "${compose[@]}" config --quiet

          diagnostics() {
            "${infra[@]}" ps -a || true
            "${infra[@]}" logs --tail=80 mongo postgres kratos || true
            "${compose[@]}" ps -a || true
            "${compose[@]}" logs --tail=80 web backend || true
          }

          trap diagnostics ERR

          "${infra[@]}" up -d \
            --pull missing \
            --wait --wait-timeout 180 \
            mongo postgres

          "${infra[@]}" run --rm --no-deps \
            --interactive=false -T \
            kratos-migrate </dev/null

          "${infra[@]}" up -d \
            --no-deps \
            --pull missing \
            kratos

          data_network="$(
            sudo -n docker inspect \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
              "$("${infra[@]}" ps -q postgres)"
          )"

          if [ -z "$data_network" ]; then
            echo "Could not determine the infrastructure network"
            exit 1
          fi

          sudo -n docker run --rm \
            --network "$data_network" \
            --entrypoint curl \
            "raccoon-pirate-backend:$sha" \
            --fail --silent --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 3 \
            --max-time 5 \
            http://kratos:4433/health/ready >/dev/null

          "${compose[@]}" up -d \
            --no-build --pull never \
            --wait --wait-timeout 120

          for path in / /api/health /api/ready /auth/kratos/health/ready /admin/login; do
            curl --fail --silent --show-error \
              --resolve dev.maanalaulaqi.com:443:127.0.0.1 \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 3 \
              --max-time 10 \
              "https://dev.maanalaulaqi.com$path" >/dev/null
          done

          admin_status="$(
            curl --silent --show-error \
              --resolve dev.maanalaulaqi.com:443:127.0.0.1 \
              --max-time 10 \
              --output /dev/null \
              --write-out '%{http_code}' \
              https://dev.maanalaulaqi.com/api/admin/me
          )"

          if [ "$admin_status" != "401" ]; then
            echo "Expected unauthenticated admin request to return 401; received $admin_status"
            exit 1
          fi

          "${infra[@]}" ps -a
          "${compose[@]}" ps
          echo "Successfully deployed application and identity services at $sha"
          REMOTE

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config