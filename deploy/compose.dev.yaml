networks:
  data:
    external: true
    name: ${DATA_NETWORK:?Set DATA_NETWORK}

services:
  web:
    image: ${DEV_IMAGE:?DEV_IMAGE must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DEV_BACKEND_IMAGE:?DEV_BACKEND_IMAGE must be set}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - data
    environment:
      MONGO_URI: "mongodb://mongo:27017/?directConnection=true"
      MONGO_DATABASE: raccoon_pirate
      MONGO_USERNAME: chief_rat_clerk
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
      RUST_LOG: warn,raccoon_pirate=info
      LOG_FORMAT: json

volumes:
  caddy_data:
    external: true
    name: raccoon-pirate_caddy_data
  caddy_config:
    external: true
    name: raccoon-pirate_caddy_config