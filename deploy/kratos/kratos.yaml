serve:
  public:
    host: 0.0.0.0
    port: 4433
  admin:
    host: 0.0.0.0
    port: 4434

selfservice:
  methods:
    password:
      enabled: true
    code:
      enabled: false
    link:
      enabled: false
    oidc:
      enabled: false

  flows:
    login:
      lifespan: 10m

    registration:
      enabled: false

    recovery:
      enabled: false

    verification:
      enabled: false

session:
  lifespan: 8h

cookies:
  same_site: Lax

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

ciphers:
  algorithm: xchacha20-poly1305

log:
  level: info
  format: json
  leak_sensitive_values: false