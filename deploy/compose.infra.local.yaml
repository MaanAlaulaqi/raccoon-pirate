services:
  mongo:
    ports:
      - "127.0.0.1:27017:27017"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  kratos:
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:4434:4434"
    command:
      - serve
      - --config
      - /etc/config/kratos/kratos.yaml
      - --dev

networks:
  data:
    internal: false